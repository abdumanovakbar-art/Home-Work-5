<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Online Shop</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f2f4f7;
    }

    /* HEADER */
     header {
        background: #111;
        color: white;
        padding: 15px 25px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    header h2 {
        margin: 0;
        font-size: 22px;
    }

    header a {
        color: white;
        text-decoration: none;
        background: crimson;
        padding: 8px 14px;
        border-radius: 6px;
    }

    header a:hover {
        background: darkred;
    }
      /* GRID */
    .products {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 280px)); /* ← o'zgartirildi */
        gap: 20px;
        padding: 30px;
        justify-content: start; /* ← qo'shildi */
    }
    /* CARD */
    .card {
        background: white;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        text-align: center;
        transition: 0.3s;
        width: 260px; /* ← qo'shildi */
    }
    .card:hover {
        transform: translateY(-5px);
    }
    .card img {
        width: 100%;
        height: 160px;
        object-fit: cover;
    }
    .content {
        padding: 15px;
    }

    .name {
        font-size: 18px;
        margin: 5px 0;
    }

    .price {
        color: green;
        font-weight: bold;
        margin-bottom: 10px;
    }

    /* BUTTON (NO JS — form submit) */
    form button {
        width: 100%;
        padding: 10px;
        border: none;
        background: #28a745;
        color: white;
        cursor: pointer;
        border-radius: 0 0 15px 15px;
        font-size: 15px;
    }

    form button:hover {
        background: #1e7e34;
    }

</style>
</head>

<body>

<header>
    <h2>🛒 My Shop</h2>
    <a href="{% url 'logout' %}">Logout</a>
</header>

<div class="products">

    {% for product in products %}
    <div class="card">

        <img src="{{ product.image.url }}" alt="product">

        <div class="content">
            <div class="name">{{ product.name }}</div>
            <div class="price">${{ product.price }}</div>
        </div>
        <form method="POST" action="{% url 'add_to_cart' product.pk %}">
            {% csrf_token %}
            <button type="submit">Add to cart</button>
        </form>
    </div>
    {% endfor %}

</div>

</body>
</html>
